x-sub: &sub "00000000-0000-4000-8000-000000000001"

bkp-vm-not-protected:
  pass: {resources: [{name: vm1, tags: {env: prod}}], context: {backup_protected: ["/subscriptions/00000000-0000-4000-8000-000000000001/resourcegroups/rg-test/providers/microsoft.compute/virtualmachines/vm1"]}}
  fail: {resources: [{name: vm1, tags: {env: prod}}], context: {backup_protected: []}}
bkp-vault-soft-delete-off:
  pass: {properties: {securitySettings: {softDeleteSettings: {softDeleteState: AlwaysON}}}}
  fail: {properties: {securitySettings: {softDeleteSettings: {softDeleteState: Disabled}}}}
bkp-vault-immutability-off:
  pass: {properties: {securitySettings: {immutabilitySettings: {state: Locked}}}}
  fail: {properties: {securitySettings: {immutabilitySettings: {state: Disabled}}}}
bkp-vault-lrs:
  pass: {properties: {redundancySettings: {standardTierStorageRedundancy: GeoRedundant}}}
  fail: {properties: {redundancySettings: {standardTierStorageRedundancy: LocallyRedundant}}}
bkp-vault-no-cross-region-restore:
  pass: {properties: {redundancySettings: {standardTierStorageRedundancy: GeoRedundant, crossRegionRestore: Enabled}}}
  fail: {properties: {redundancySettings: {standardTierStorageRedundancy: GeoRedundant, crossRegionRestore: Disabled}}}
bkp-vault-public-network:
  pass: {properties: {publicNetworkAccess: Disabled}}
  fail: {properties: {publicNetworkAccess: Enabled}}
rel-single-vm-workload:

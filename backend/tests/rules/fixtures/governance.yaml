x-sub: &sub "00000000-0000-4000-8000-000000000001"
x-rg: &rg /subscriptions/00000000-0000-4000-8000-000000000001/resourcegroups/rg-test

gov-required-tags-missing:
  pass: {resources: [{type: microsoft.storage/storageaccounts, name: st1, tags: {env: prod, owner: a@x, costCenter: CC-1}}]}
  fail: {resources: [{type: microsoft.storage/storageaccounts, name: st1, tags: {env: prod}}], expect: [st1]}
gov-rg-required-tags-missing:
  pass: {context: {resource_groups: [{id: *rg, name: rg-test, subscriptionId: *sub, tags: {env: dev, owner: a@x, costCenter: CC-1}}]}}
  fail: {context: {resource_groups: [{id: *rg, name: rg-test, subscriptionId: *sub, tags: {}}]}}
gov-naming-violation:
  pass:
    resources: [{type: microsoft.storage/storageaccounts, name: stcontosoapp01}]
    context: {settings: {governance: {naming: [{resource_type: microsoft.storage/storageaccounts, pattern: "^st[a-z0-9]+$"}]}}}
  fail:
    resources: [{type: microsoft.storage/storageaccounts, name: contosoapp01}]
    context: {settings: {governance: {naming: [{resource_type: microsoft.storage/storageaccounts, pattern: "^st[a-z0-9]+$"}]}}}
gov-region-not-allowed:
  pass:
    resources: [{type: microsoft.storage/storageaccounts, name: st1, location: eastus}]
    context: {settings: {governance: {allowed_regions: [eastus, westeurope]}}}
  fail:
    resources: [{type: microsoft.storage/storageaccounts, name: st1, location: brazilsouth}]
    context: {settings: {governance: {allowed_regions: [eastus, westeurope]}}}
gov-vm-size-not-allowed:
  pass:
    resources: [{name: vm1, properties: {hardwareProfile: {vmSize: Standard_D2s_v5}}}]
    context: {settings: {governance: {allowed_vm_skus: [Standard_D2s_v5, Standard_D4s_v5]}}}
  fail:
    resources: [{name: vm1, properties: {hardwareProfile: {vmSize: Standard_D16s_v5}}}]
    context: {settings: {governance: {allowed_vm_skus: [Standard_D2s_v5, Standard_D4s_v5]}}}
gov-no-lock-production:
  pass:
    prod: true
    resources: [{type: microsoft.keyvault/vaults, name: kv1}]
    context: {locks: [{id: "/subscriptions/00000000-0000-4000-8000-000000000001/resourcegroups/rg-test/providers/microsoft.authorization/locks/protect", name: protect, properties: {level: CanNotDelete}}]}
  fail:
    prod: true
    resources: [{type: microsoft.keyvault/vaults, name: kv1}]
    context: {locks: []}
gov-empty-resource-group:
  pass: {resources: [{type: microsoft.storage/storageaccounts, name: st1}]}
  fail: {resources: []}
gov-empty-subscription:
  pass: {resources: [{type: microsoft.storage/storageaccounts, name: st1}]}
  fail: {resources: []}
gov-subscription-no-budget:
  pass: {context: {budgets: {*sub : [{name: monthly, properties: {amount: 1000}}]}}}
  fail: {context: {budgets: {*sub : []}}}
gov-policy-noncompliant:
  pass: {context: {policy: {*sub : {nonCompliantResources: 0, assignments: [{displayName: Allowed locations, nonCompliantResources: 0}]}}}}
  fail: {context: {policy: {*sub : {nonCompliantResources: 3, assignments: [{displayName: Require tags, nonCompliantResources: 3}]}}}}
gov-no-policy-assignments:
  pass: {context: {policy: {*sub : {nonCompliantResources: 0, assignments: [{displayName: Allowed locations, nonCompliantResources: 0}]}}}}
  fail: {context: {policy: {*sub : {nonCompliantResources: 0, assignments: []}}}}
gov-env-tag-nonstandard:
  pass: {resources: [{type: microsoft.storage/storageaccounts, name: st1, tags: {env: prod}}]}
  fail: {resources: [{type: microsoft.storage/storageaccounts, name: st1, tags: {env: Prod-EU}}]}
gov-classic-resources:
  pass: {resources: [{type: microsoft.storage/storageaccounts, name: st1}]}
  fail: {resources: [{type: microsoft.classicstorage/storageaccounts, name: st1}]}
